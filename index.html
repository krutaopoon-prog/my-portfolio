<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - นายเดชา สุขสำราญ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Floating bubbles background */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -80px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: rise linear infinite;
        }

        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 20px; height: 20px; left: 20%; animation-duration: 5s; animation-delay: 1s; }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 35%; animation-duration: 7s; animation-delay: 2s; }
        .bubble:nth-child(4) { width: 80px; height: 80px; left: 50%; animation-duration: 11s; animation-delay: 0s; }
        .bubble:nth-child(5) { width: 35px; height: 35px; left: 55%; animation-duration: 6s; animation-delay: 1s; }
        .bubble:nth-child(6) { width: 45px; height: 45px; left: 65%; animation-duration: 8s; animation-delay: 3s; }
        .bubble:nth-child(7) { width: 25px; height: 25px; left: 75%; animation-duration: 7s; animation-delay: 2s; }
        .bubble:nth-child(8) { width: 60px; height: 60px; left: 85%; animation-duration: 10s; animation-delay: 0s; }
        .bubble:nth-child(9) { width: 30px; height: 30px; left: 90%; animation-duration: 9s; animation-delay: 1s; }
        .bubble:nth-child(10) { width: 70px; height: 70px; left: 5%; animation-duration: 12s; animation-delay: 2s; }

        @keyframes rise {
            0% {
                bottom: -80px;
                transform: translateX(0) scale(1);
                opacity: 0.4;
            }
            50% {
                opacity: 0.2;
            }
            100% {
                bottom: 110%;
                transform: translateX(100px) scale(0.5);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
            animation: cardAppear 0.8s ease-out;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .profile-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .name {
            font-size: 2em;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1em;
            color: #718096;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .info-list {
            list-style: none;
            text-align: left;
            margin-bottom: 30px;
        }

        .info-list li {
            padding: 14px 20px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1.05em;
            color: #4a5568;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .info-list li:hover {
            background: linear-gradient(135deg, #ebf4ff, #e9d8fd);
            border-color: #667eea;
            transform: translateX(5px);
        }

        .info-list li .emoji {
            font-size: 1.5em;
            min-width: 36px;
            text-align: center;
        }

        .info-list li .label {
            font-weight: 600;
            color: #2d3748;
            min-width: 90px;
        }

        .favorite-section {
            background: linear-gradient(135deg, #fefce8, #fef3c7);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px dashed #f59e0b;
        }

        .favorite-section h3 {
            color: #b45309;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .egg-animation {
            font-size: 3em;
            display: inline-block;
            animation: sizzle 0.5s ease-in-out infinite alternate;
        }

        @keyframes sizzle {
            0% { transform: rotate(-5deg) scale(1); }
            100% { transform: rotate(5deg) scale(1.1); }
        }

        .favorite-text {
            font-size: 1.2em;
            color: #92400e;
            font-weight: 600;
            margin-top: 8px;
        }

        .footer {
            color: #a0aec0;
            font-size: 0.85em;
            font-weight: 300;
            margin-top: 10px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .card {
                padding: 35px 25px;
            }
            .name {
                font-size: 1.6em;
            }
            .profile-image {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating background bubbles -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="card">
        <img src="images/profile.jpg" alt="รูปโปรไฟล์ของเดชา" class="profile-image">

        <h1 class="name">นายเดชา สุขสำราญ</h1>
        <p class="subtitle">ยินดีที่ได้รู้จักครับ! 👋</p>

        <ul class="info-list">
            <li>
                <span class="emoji">👤</span>
                <span class="label">ชื่อ</span>
                <span>เดชา สุขสำราญ</span>
            </li>
            <li>
                <span class="emoji">🎂</span>
                <span class="label">อายุ</span>
                <span>15 ปี</span>
            </li>
            <li>
                <span class="emoji">🎓</span>
                <span class="label">สถานะ</span>
                <span>นักเรียน</span>
            </li>
        </ul>

        <div class="favorite-section">
            <h3>🍳 อาหารที่ชอบที่สุด</h3>
            <div class="egg-animation">🍳</div>
            <p class="favorite-text">ไข่เจียว!</p>
            <p style="color: #a16207; font-size: 0.9em; margin-top: 5px;">กินได้ทุกวัน ไม่มีเบื่อ 😋</p>
        </div>

        <p class="footer">
            สร้างด้วย ❤️ โดย เดชา สุขสำราญ<br>
            Hosted on <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>
        </p>
    </div>
</body>
</html>
